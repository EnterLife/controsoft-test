[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controsoft-qa-assignment"
version = "0.1.0"
description = "End-to-end pytest check for a Linux/Qt signal monitor"
requires-python = ">=3.10"
dependencies = [
    "allure-pytest>=2.13,<3.0",
    "dogtail>=2.1,<3.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: critical startup and happy-path checks",
    "ui: desktop user-interface tests",
    "linux: tests that require a Linux graphical session",
]

[tool.setuptools.packages.find]
where = ["src"]
